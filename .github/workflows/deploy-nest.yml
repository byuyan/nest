name: deploy-nest

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull site package
        run: |
          curl -fsSL -o /tmp/site.zip "https://aka.doubaocdn.com/s/hgUZfvvdS7"
          unzip -o /tmp/site.zip -d .
          ls -la . assets assets/img assets/css assets/js

      - name: Commit site files
        run: |
          git config user.name "nest-bot"
          git config user.email "byuyan@qq.com"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "chore: sync site package"
            git push
          else
            echo "nothing to commit"
          fi

      - name: Enable GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/pages")
          echo "pages api status: $code"
          if [ "$code" != "200" ]; then
            curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/pages" -d '{"source":{"branch":"main","path":"/"}}'
          fi
